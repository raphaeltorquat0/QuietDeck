name: QuietDeck
options:
  bundleIdPrefix: io.github.raphaeltorquat0
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
  fileTypes:
    icon:
      file: true
      buildPhase: resources
packages:
  QuietDeckKit:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  QuietDeck:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: QuietDeckKit
        product: DeckKit
      - package: QuietDeckKit
        product: DeckRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.raphaeltorquat0.QuietDeck
        PRODUCT_NAME: QuietDeck
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: App/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Support/QuietDeck.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        DEAD_CODE_STRIPPING: YES
      configs:
        Release:
          ONLY_ACTIVE_ARCH: NO
          ARCHS: "arm64 x86_64"
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
