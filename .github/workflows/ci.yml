name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Testes
        run: make test
      - name: Build
        run: brew install xcodegen && scripts/build-app.sh

  # Runners macOS não têm Docker: a integração roda no Linux, com o mesmo código de transporte.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"
      - name: Ferramentas do cliente
        run: sudo apt-get update && sudo apt-get install -y rsync openssh-client mame-tools zip unzip
      - name: Deck simulado
        run: make harness
      - name: Testes de integração
        run: |
          QUIETDECK_TEST_NETWORK=1 QUIETDECK_TEST_HOST=127.0.0.1 QUIETDECK_TEST_PORT=2222 QUIETDECK_TEST_PASSWORD=deck-password \
            swift test --filter Integration --no-parallel
