name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Testes
        run: make test
      - name: Build
        run: brew install xcodegen && scripts/build-app.sh

  # Runners macOS não têm Docker: a integração roda no Linux, com o mesmo código de transporte.
  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"
      - name: Ferramentas do cliente
        run: sudo apt-get update && sudo apt-get install -y rsync openssh-client mame-tools zip unzip cifs-utils
      - name: Deck simulado
        run: make harness
      - name: Servidor de acervo
        run: |
          make shelf-harness
          mkdir -p /tmp/qd-smb
          for i in $(seq 1 20); do
            sudo mount -t cifs //127.0.0.1/acervo /tmp/qd-smb -o port=4445,username=acervo,password=acervo-password,ro && break
            sleep 0.5
          done
          mountpoint /tmp/qd-smb
      - name: Testes de integração
        run: |
          QUIETDECK_TEST_HOST=127.0.0.1 QUIETDECK_TEST_PORT=2222 QUIETDECK_TEST_PASSWORD=deck-password \
          QUIETDECK_TEST_SHELF=1 QUIETDECK_TEST_SMB=/tmp/qd-smb \
            swift test --filter Integration --no-parallel
      # O instalador oficial consulta github.com e a API do GitHub: pode falhar por limite de taxa do runner.
      - name: Instalador oficial do Decky
        continue-on-error: true
        run: |
          QUIETDECK_TEST_NETWORK=1 QUIETDECK_TEST_HOST=127.0.0.1 QUIETDECK_TEST_PORT=2222 QUIETDECK_TEST_PASSWORD=deck-password \
            swift test --filter officialDeckyInstaller --no-parallel
